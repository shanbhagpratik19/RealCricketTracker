<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealCricketTracker</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
    <h1>🏏 RealCricketTracker</h1>
    <p>Track Tests, ODIs and T20s</p>
</header>

<div class="section">
    <h2>Theme</h2>
    <button onclick="toggleTheme()">Toggle Dark Mode</button>
</div>

<div class="section">
    <h2>Features</h2>

    <ul>
        <li>Test Match Tracking</li>
        <li>ODI Phase Tracking</li>
        <li>T20 Match Tracking</li>
        <li>Player Profiles</li>
        <li>Team Profiles</li>
        <li>Statistics Dashboard</li>
        <li>Tournament Tables</li>
    </ul>
</div>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>

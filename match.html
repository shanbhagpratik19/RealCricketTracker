<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Details</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🏏 Match Details</h1>
</header>

<div class="section">

    <div id="matchDetails">
        Loading match...
    </div>

</div>

<div class="section">

    <h2>🏏 Add Batter</h2>

    <select id="inningsNumber">
        <option value="1">Innings 1</option>
        <option value="2">Innings 2</option>
        <option value="3">Innings 3</option>
        <option value="4">Innings 4</option>
    </select>

    <br><br>

    <input type="text"
           id="playerName"
           placeholder="Player Name">

    <br><br>

    <input type="number"
           id="runs"
           placeholder="Runs">

    <br><br>

    <input type="number"
           id="balls"
           placeholder="Balls">

    <br><br>

    <input type="number"
           id="fours"
           placeholder="4s">

    <br><br>

    <input type="number"
           id="sixes"
           placeholder="6s">

    <br><br>

    <input type="text"
           id="dismissal"
           placeholder="Dismissal">

    <br><br>

    <button onclick="saveBatter()">
        Save Batter
    </button>

</div>

<div class="section">

    <h2>🏏 Batting Card</h2>

    <div id="battingCard">

        No batters added.

    </div>

</div>

<script type="module" src="match.js"></script>

</body>
</html>

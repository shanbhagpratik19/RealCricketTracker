<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RealCricketTracker Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🏏 RealCricketTracker Admin</h1>
    <p>Manage Matches, Players and Statistics</p>
</header>

<div class="section">
    <h2>Add Match</h2>

    <input type="text" id="team1" placeholder="Team 1">

    <br><br>

    <input type="text" id="team2" placeholder="Team 2">

    <br><br>

    <select id="format">
        <option>Test</option>
        <option>ODI</option>
        <option>T20</option>
    </select>

    <br><br>

    <input type="text" id="venue" placeholder="Venue">

    <br><br>

    <button onclick="saveMatch()">Save Match</button>
</div>

<div class="section">
    <h2>Dashboard</h2>
    <p>Total Matches: 0</p>
    <p>Total Players: 0</p>
    <p>Total Teams: 0</p>
</div>

<script type="module" src="app.js"></script>

</body>
</html>
